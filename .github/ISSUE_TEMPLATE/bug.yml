name: Report a bug
description: A reproducible interface or software issue. Report security issues privately.
body:
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what should happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, device and browser
      description: Use disposable examples. Leave personal data and credentials out.
    validations:
      required: true
